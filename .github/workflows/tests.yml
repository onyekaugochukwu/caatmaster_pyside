name: Tests

# Runs the full pytest suite on every push/PR to main - the test suite
# had accumulated 41 permanently-failing tests before this workflow
# existed, with nothing running it automatically to notice. Restoring
# those to green is only worth something if a future regression can't
# silently join them unnoticed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Qt/PySide6 runtime dependencies
        # PySide6 (and therefore anything importing it, which most of
        # this codebase does even for "headless" logic) needs these
        # system libraries present to import at all on a bare Ubuntu
        # runner - QT_QPA_PLATFORM=offscreen avoids needing a real
        # display, but doesn't avoid needing Qt's own shared libraries.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libgl1 libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/ -v --tb=short

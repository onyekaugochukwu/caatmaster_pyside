name: Release

# Builds portable packages for Windows, Linux, and macOS and publishes
# them as GitHub Release assets, alongside the companion book PDF.
#
# Triggered by pushing a tag matching v*  (e.g. v0.1.0-beta), or
# manually via workflow_dispatch for a dry run against a branch -
# a manual run builds and uploads artifacts but does not create or
# publish a release, since that needs a real tag to attach to.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Qt/PySide6 runtime dependencies
        # PyInstaller's Analysis phase actually imports every hidden
        # import to trace it, so these need to be present at build
        # time too, not just at test time.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libgl1 libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build portable directory
        run: python build_linux.py

      - name: Build AppImage
        run: python build_appimage.py

      - uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            CAATmaster_Linux_Portable_*.tar.gz
            CAATmaster-*-x86_64.AppImage
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build portable directory
        run: python build_windows.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: CAATmaster_Win_Portable_*.zip
          if-no-files-found: error

  build-macos:
    # GitHub's hosted macOS runners are Apple Silicon (arm64) only -
    # Intel runner images (macos-13 and earlier) were retired, and
    # PyInstaller bundles the interpreter it runs under, so this build
    # only runs on Apple Silicon Macs. An Intel build would need
    # self-hosted Intel Mac hardware, which isn't set up here.
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build CAATmaster.app
        run: python build_macos.py

      - uses: actions/upload-artifact@v4
        with:
          name: macos-builds
          path: CAATmaster_macOS_*.zip
          if-no-files-found: error

  release:
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: true
          body: |
            Portable downloads below - no installation required, just extract/mount and run.

            - **Windows**: `CAATmaster_Win_Portable_*.zip` - extract and run `start.bat` or `CAATmaster.exe`.
            - **Linux**: `CAATmaster-*-x86_64.AppImage` (`chmod +x`, then run directly) or `CAATmaster_Linux_Portable_*.tar.gz`.
            - **macOS**: `CAATmaster_macOS_arm64_*.zip` - Apple Silicon (M1/M2/M3/M4) only; GitHub's hosted macOS runners no longer support Intel, so no Intel build is offered. Unsigned build, see the bundled README for the Gatekeeper workaround.
            - The companion book, *Audit Analytics with CaatMaster*, is attached as a PDF.
          files: |
            artifacts/linux-builds/*
            artifacts/windows-builds/*
            artifacts/macos-builds/*
            docs/book/Audit-Analytics-with-CaatMaster.pdf
